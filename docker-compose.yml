# frpc Web 配置界面 · 纯前端部署模板
#
# 场景：一个面板容器，连接任意多个已有 frpc 实例（替换官方/旧版面板）。
#      目标 frpc 地址在面板"连接设置"里填——请求经本容器按 X-Frpc-Target
#      头动态转发到对应 frpc 的 webServer API。
#
# 快速开始：
#   1. docker compose up -d
#   2. 浏览器打开 http://<宿主机IP>:8080
#   3. 右上角连接设置：地址填你 frpc 的 webServer 地址（如 http://192.168.1.10:7500），
#      账号密码 = 那台 frpc [webServer] 的 user/password
#   4. 想切另一台 frpc？连接设置里改地址即可，同一个面板随便连
#
# 注意：
#   - 目标 frpc 的 webServer 必须允许本容器访问（addr 不能是 127.0.0.1）
#   - 连官方版 frpc：配置文件编辑页可用；Store 代理管理/场景模板需要本仓库
#     构建的 frpc（dockerfiles/Dockerfile-frpc-full 全家桶镜像）
#   - 按头转发=开放代理性质，仅在内网使用，不要直接暴露公网

services:
  frpc-web:
    build: .
    # 用现成镜像（CI 构建产物）注释掉 build，放开下面这行：
    # image: ghcr.io/lamp3721/frpc-web-optimize:latest
    container_name: frpc-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=Asia/Shanghai
      # 以下均可选：
      # - RESOLVER=127.0.0.11 8.8.8.8 114.114.114.114   # 动态转发 DNS 解析器（含容器内置 DNS）
      # - FRPC_UPSTREAM=http://192.168.1.10:7500        # 未填连接信息时的回退目标
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# ---------------------------------------------------------------
# 备选：全家桶镜像（frpc + 本面板一体，适合还没有 frpc 的机器），
# 见 dockerfiles/Dockerfile-frpc-full，compose 示例：
#
#   frpc:
#     build: { context: ., dockerfile: dockerfiles/Dockerfile-frpc-full }
#     restart: unless-stopped
#     ports: ["7500:7500"]
#     environment:
#       - FRPC_SERVER_ADDR=frps.example.com
#       - FRPC_TOKEN=yourtoken
#     volumes: ["./data:/etc/frp"]
# ---------------------------------------------------------------
