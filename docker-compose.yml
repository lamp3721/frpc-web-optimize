# frpc Web 配置界面 · 纯前端部署模板
#
# 场景：你已有正在运行的 frpc 实例（官方/旧版面板），
#      本容器只跑优化过的配置界面，通过 FRPC_UPSTREAM 连到它的 API，替换旧面板。
#
# 快速开始：
#   1. 改 FRPC_UPSTREAM 为你已有 frpc 的 webServer 地址
#   2. docker compose up -d
#   3. 浏览器打开 http://<宿主机IP>:8080
#      右上角连接设置：地址填本面板地址，账号密码 = 你 frpc 的 webServer 账号密码
#      （如 admin/admin，即 frpc.toml [webServer] 里的 user/password）
#
# 注意：
#   - 已有 frpc 需在配置里开启 [webServer]（addr 允许本容器访问，不能用 127.0.0.1）
#   - 连官方版 frpc 时：配置文件编辑页可用；Store 代理管理/场景模板需要
#     本仓库构建的 frpc（用 dockerfiles/Dockerfile-frpc-full 全家桶镜像）
#   - 一个面板只连一个 frpc（FRPC_UPSTREAM）；连多个就多起几个容器改端口和地址

services:
  frpc-web:
    build: .
    # 用现成镜像（CI 构建产物）注释掉 build，放开下面这行：
    # image: ghcr.io/lamp3721/frpc-web-optimize:latest
    container_name: frpc-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - FRPC_UPSTREAM=http://192.168.1.10:7500   # 必改：已有 frpc 的 webServer 地址
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# ---------------------------------------------------------------
# 备选：全家桶镜像（frpc + 本面板一体，适合还没有 frpc 的机器），
# 见 dockerfiles/Dockerfile-frpc-full，compose 示例：
#
#   frpc:
#     build: { context: ., dockerfile: dockerfiles/Dockerfile-frpc-full }
