# ==============================================
# frp Dashboard Nginx 配置
# ==============================================
# 前端在 X-Frpc-Target 头传目标地址，nginx 动态转发

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 1009;
    listen [::]:1009;
    server_name dashboard.example.com;

    root /var/www/frpc-dashboard/dist;
    index index.html;

    # DNS 解析器（变量 proxy_pass 需要）
    resolver 8.8.8.8 114.114.114.114 valid=300s;
    resolver_timeout 5s;

    # ==================== 日志 ====================
    access_log /var/log/nginx/frpc-dashboard.log combined;
    error_log  /var/log/nginx/frpc-dashboard-error.log warn;

    # ==================== 静态文件 ====================
    location / {
        try_files $uri /index.html;
    }

    # ==================== API 动态代理 ====================
    location /api/ {
        # 目标地址由前端 X-Frpc-Target 请求头指定
        set $target $http_x_frpc_target;

        if ($target = "") {
            return 502 '{"error":"未配置连接，请在页面设置中填写 frpc 地址"}';
        }

        proxy_pass $target;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        # 基本头部
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 超时（管理 API 响应慢时可调大）
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 缓冲
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

